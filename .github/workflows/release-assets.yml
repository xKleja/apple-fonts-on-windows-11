name: Release assets

# Downloads the fonts exactly as a user's first install does (Install.cmd -DownloadOnly changes nothing
# on Windows): proves that fonts/release.txt names a release whose zips match the checksums in git.
on:
  push:
    branches: [main]
    paths:
      - 'fonts/**'
      - 'install.ps1'
      - 'Install.cmd'
      - 'scripts/checks.ps1'
      - '.github/workflows/release-assets.yml'
  schedule:
    - cron: '17 4 * * 1'   # weekly: a deleted or replaced release asset is noticed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    name: Install.cmd -DownloadOnly
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download, verify and unpack through the launcher
        shell: cmd
        run: call Install.cmd -DownloadOnly < nul
      - name: Every font is in place
        shell: pwsh
        run: |
          $n = (Get-ChildItem fonts -Recurse -File -Include *.ttf, *.otf).Count
          if ($n -ne 169) { throw "expected 169 fonts (155 SF/New York + 13 UI + 1 emoji), found $n" }
          if (Test-Path downloads) { throw 'downloads\ was not cleaned up' }
          "OK: $n fonts"

  paste-in:
    # The README's paste-in line downloads get.ps1 from the latest release: it must exist and name that
    # release. Not on push: a new get.ps1 is attached when its release is published, after the push.
    name: Latest release has its get.ps1
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: get.ps1 is attached and names the latest release
        run: |
          latest=$(curl -fsSIo /dev/null -w '%{redirect_url}' "https://github.com/${GITHUB_REPOSITORY}/releases/latest")
          tag=${latest##*/}
          echo "latest release: $tag"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/get.ps1" -o get.ps1
          grep -qF "\$Tag  = '$tag'" get.ps1
