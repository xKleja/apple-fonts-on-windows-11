name: Bug report
description: Something did not work as expected when installing, checking, or uninstalling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in every field; it saves a round trip.

        **Privacy:** before pasting any output, remove usernames, computer names, and personal paths (for example, replace `C:\Users\<name>\...` with `C:\Users\USER\...`).
  - type: dropdown
    id: how
    attributes:
      label: How did you run it?
      options:
        - Double-clicked Install.cmd / Uninstall.cmd / Status.cmd
        - Uninstalled from Settings > Apps > Installed apps
        - Ran install.ps1 / uninstall.ps1 / status.ps1 in PowerShell
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: Your Windows account
      description: Administrator, or a standard account where someone typed an administrator's password at the UAC prompt?
    validations:
      required: true
  - type: input
    id: update
    attributes:
      label: Recent Windows update?
      description: Did Windows install an update since the fonts were installed? (The Windows version and build are in the Status.cmd output below.)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead? Include screenshots if they help (with personal details removed).
    validations:
      required: true
  - type: textarea
    id: status-output
    attributes:
      label: Output of Status.cmd
      description: Double-click Status.cmd in the project folder and paste the full output (it includes the project version and Windows build). Remove usernames and personal paths first.
      render: text
    validations:
      required: true
  - type: input
    id: options
    attributes:
      label: Options used
      description: Any switches you passed, for example `-SkipEmoji`, `-Resume`, `-BackupDir D:\x`. Leave empty if none.
  - type: textarea
    id: logs
    attributes:
      label: Install or restore log (optional)
      description: A failed install prints the path of its log. Otherwise the newest `install-*.log` or `restore-*.log` in `%ProgramData%\AppleFontsOnWindows\` (or your `-BackupDir`). Remove usernames and personal paths first.
      render: text
  - type: checkboxes
    id: disclaimer
    attributes:
      label: Disclaimer
      options:
        - label: I have read the licensing disclaimer at the top of the README.
          required: true
